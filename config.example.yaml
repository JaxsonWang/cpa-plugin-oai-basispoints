# CPA 宿主配置示例：将本文件内容合并到 CPA 的 config.yaml。
# 已有 plugins 节点时，请合并其子项，不要重复添加同名节点或覆盖其他插件。
# 本文件不会被插件自动读取；CPA 会把 plugins.configs.oai-basispoints 的参数传给插件。
plugins:
  # CPA 插件系统总开关；仅打开下方单个插件开关还不够。
  enabled: true
  configs:
    oai-basispoints:
      # 启用本插件。插件 ID 固定为 oai-basispoints，请勿随意改名。
      enabled: true

      # Basis Points Responses 接口地址，通常无需修改。
      responses_url: https://bps.openai.com/basispoints/api/responses

      # 未在 model_mappings 中单独配置的别名使用此上游模型。
      # 不配置 model_mappings 时，保持原有行为：所有别名都使用此模型。
      upstream_model: gpt-6-astra

      # 启用的客户端模型别名列表，插件不限制条目数量。
      # 推荐保留 -basispoints 后缀，避免与 CPA 原生 Codex 模型混淆。
      # 请求未指定模型时，使用列表中的第一项。
      models:
        - gpt-6-astra-basispoints
        - gpt-5.6-sol-basispoints

      # 别名到实际上游模型的映射，支持任意数量，不限于本示例的两项。
      # 添加模型：在 models 中加入别名，再在此处添加「别名: 上游模型名」。
      # 移除模型：同时删除 models 中的别名及此处的对应映射。
      # 映射键必须已列入 models，键和值均不可为空；多个别名可指向同一上游。
      # 示例只说明路由配置，实际可用模型及其参数取决于 Basis Points 和账号权限。
      model_mappings:
        gpt-6-astra-basispoints: gpt-6-astra
        gpt-5.6-sol-basispoints: gpt-5.6-sol

      # auto：仅当前 CPA 凭据的 websockets 开关开启时优先 WS；每轮握手一次。
      # 在 CPA 原生凭证设置中开启或关闭 websockets；插件不提供独立设置页。
      # 多账号分别按各自开关尝试，不限制同时启用的账号数量；能否返回 101 由上游决定。
      # 凭据开关关闭、缺失或无效时直接走 HTTP/SSE，不先握手，也不改写凭据。
      # 开启后的握手失败仍按下方规则回退原 HTTP/SSE。
      # http：主动关闭 WS，仅使用原有 HTTP 通道（流式为 SSE，非流式保持原语义）。
      # 401/403/407/429 不回退；WS 已建立有效连接后，不再换通道重放请求。
      upstream_transport: auto

      # incremental（默认）：正文/推理摘要实时交付，已交付后工具失败不重生成。
      # buffered：本轮有可调用工具时缓冲整轮，工具校验失败可在交付前重生成一次。
      # 接受首字等待整轮完成（含可能的重生成）时才启用；不会重复交付失败尝试。
      # 无工具或 tool_choice: none 仍实时交付；上游请求仍为流式且沿用大小/超时限制。
      stream_tool_mode: incremental

      # 单次 WS 握手上限，单位：秒；范围：1～30，默认 5。
      # 不连续重试握手；下一轮请求重新优先尝试 WS。
      ws_handshake_timeout_seconds: 5

      # 读取上游响应的超时时间，单位：秒；范围：10～1800，默认 300。
      timeout_seconds: 300

      # 上游响应体大小上限，单位：字节；默认 67108864（64 MiB）。
      # 允许范围：65536（64 KiB）～134217728（128 MiB）。
      max_response_bytes: 67108864

      # 认证模式，通常保持 chatgpt；凭据来自 CPA 已有的 Codex OAuth 文件。
      # 不要在这里填写 access_token、refresh_token 或其他密钥。
      auth_mode: chatgpt

      # 可选：权威 Basis Points 工具目录版本 ID。默认留空，不发送版本标识。
      # 仅在已取得确切版本 ID 时填写，不要自行编造。
      tools_version_id: ""

      # 凭据来源：host（默认）或显式选择 virtual；未配置或留空均为 host。
      # virtual：插件接管 type: codex 文件，展开原生 + Basis Points 两条虚拟认证。
      #   未修改的 CPA 不持久化虚拟认证的刷新结果：重启后会加载已轮换失效的 refresh_token，
      #   Basis Points 记录也不跟随原生刷新，access_token 到期后需重新导入源凭据。
      # host：插件不接管 Codex 文件，由 CPA 原生加载、刷新并写回源文件；执行 Basis Points
      #   请求时通过 host.auth.get 读取宿主当前凭据，按顺序轮询未禁用的 Codex 认证。
      #   别名模型由插件路由器直接交给本执行器，WS 和代理沿用 CPA 凭据及宿主设置。
      #   不使用原生 Codex 通道的冷却，也不在生成失败后自动换号重放。
      credential_source: host

      # 非敏感配置的持久化目录，默认值为 plugins/oai-basispoints-data。
      # 当前实现会先读取 YAML，再用此目录中已有的 settings.json 覆盖对应字段。
      # 本示例留空：只由 YAML 管理配置，避免旧文件覆盖模型列表和映射。
      # 留空不会删除已有的 settings.json，也不会禁用 CPA 的 OAuth 凭据读取。
      # 如需持久化，请填写 CPA 进程可写目录；相对路径以其工作目录为基准。
      data_dir: ""
